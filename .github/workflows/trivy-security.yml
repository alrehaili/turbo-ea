
name: Security - Trivy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan dependencies and configurations
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          exit-code: '0'
          skip-dirs: node_modules,.venv,dist,build
