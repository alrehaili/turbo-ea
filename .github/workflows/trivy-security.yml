
name: Security - Trivy

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 2. Scan dependencies and configurations
      - name: Scan dependencies and configurations
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          version: v0.76.2
          scan-ref: .
          scanners: vuln,misconfig
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          format: json
          output: trivy-report.json
          exit-code: '0'
          skip-dirs: "**/node_modules,**/.venv,**/dist,**/build,**/.terraform"
          hide-progress: true
          trivyignores: .github/trivy-fs-exceptions.yaml

      # 3. Generate readable GitHub Actions report
      - name: Generate security summary
        if: always()
        shell: bash
        run: |
          echo "## Turbo-EA Security Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scanner:** Trivy" >> "$GITHUB_STEP_SUMMARY"
          echo "**Repository:** $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${GITHUB_SHA:0:12}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scan type:** Filesystem" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s trivy-report.json ]; then
            echo "### Scan failed or incomplete" >> "$GITHUB_STEP_SUMMARY"
            echo "No Trivy JSON report was generated." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! jq -e '.Results | type == "array"' \
              trivy-report.json >/dev/null; then
            echo "### Invalid report" >> "$GITHUB_STEP_SUMMARY"
            echo "Trivy did not produce a valid results array." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "### Severity Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | Findings |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          for severity in CRITICAL HIGH MEDIUM LOW UNKNOWN; do
            count=$(jq --arg s "$severity" '
              [
                .Results[]? |
                (
                  .Vulnerabilities[]?,
                  .Misconfigurations[]?
                ) |
                select(.Severity == $s)
              ] | length
            ' trivy-report.json)

            echo "| $severity | $count |" >> "$GITHUB_STEP_SUMMARY"
          done

          total=$(jq '
            [
              .Results[]? |
              (
                .Vulnerabilities[]?,
                .Misconfigurations[]?
              )
            ] | length
          ' trivy-report.json)

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total findings:** $total" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "### Top Findings" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Severity | ID | Package / Target | Fix |" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            [
              .Results[]? as $result |
              (
                $result.Vulnerabilities[]? |
                {
                  severity: .Severity,
                  id: .VulnerabilityID,
                  item: (.PkgName // $result.Target),
                  fix: (.FixedVersion // "Not available")
                }
              ),
              (
                $result.Misconfigurations[]? |
                {
                  severity: .Severity,
                  id: .ID,
                  item: $result.Target,
                  fix: "Review configuration"
                }
              )
            ]
            | sort_by(
                if .severity == "CRITICAL" then 0
                elif .severity == "HIGH" then 1
                elif .severity == "MEDIUM" then 2
                elif .severity == "LOW" then 3
                else 4 end
              )
            | .[:20][]
            | [
                .severity,
                .id,
                .item,
                .fix
              ]
            | map(
                tostring
                | gsub("[\\r\\n|]"; " ")
                | .[0:160]
              )
            | "| " + join(" | ") + " |"
          ' trivy-report.json >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Showing up to 20 findings. Download the JSON artifact for full details." \
            >> "$GITHUB_STEP_SUMMARY"

      # 4. Store detailed report for 7 days
      - name: Upload detailed security report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: warn
          retention-days: 7

      # 5. Make scan execution failures visible
      - name: Validate scan execution
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "::error::Trivy scan execution failed."
            exit 1
          fi

          if [ ! -s trivy-report.json ]; then
            echo "::error::Trivy report is missing."
            exit 1
          fi

          jq -e '.Results | type == "array"' \
            trivy-report.json >/dev/null

          # Fail on findings as well as scanner failures. The observation and
          # artifact steps above always preserve the full report for review.
          findings=$(jq '[.Results[]? | (.Vulnerabilities[]?, .Misconfigurations[]?)] | length' trivy-report.json)
          if [ "$findings" -gt 0 ]; then
            echo "::error::$findings unaccepted security findings; review the report artifact."
            exit 1
          fi

  python-dependencies:
    name: Python dependency audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [backend, mcp-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Resolve and audit production dependencies
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          python -m pip install "pip<26.2" pip-tools pip-audit
          pip-compile --quiet --strip-extras -o /tmp/requirements.txt "$PROJECT/pyproject.toml"
          pip-audit --strict --desc -r /tmp/requirements.txt

  postgres-fixture:
    name: Hardened PostgreSQL fixture smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: security-fixture
      - name: Boot the actual non-root, read-only CI fixture
        run: |
          kubectl create namespace turbo-ea-security-test
          kubectl apply -n turbo-ea-security-test -f charts/turbo-ea/ci/postgres.yaml
          kubectl rollout status -n turbo-ea-security-test deployment/turbo-ea-ci-postgres --timeout=180s
          test "$(kubectl exec -n turbo-ea-security-test deployment/turbo-ea-ci-postgres -- id -u)" = 70
          kubectl exec -n turbo-ea-security-test deployment/turbo-ea-ci-postgres -- \
            psql -U turboea -d turboea -v ON_ERROR_STOP=1 -c 'SELECT 1'
      - name: Fixture diagnostics
        if: failure()
        run: |
          kubectl describe pods -n turbo-ea-security-test
          kubectl logs -n turbo-ea-security-test deployment/turbo-ea-ci-postgres
